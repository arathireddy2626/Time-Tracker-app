spring.application.name=firebase

firebase.collection.employees=employees
firebase.collection.projects=projects
firebase.collection.timeEntries=timeEntries
firebase.collection.assignments=projectAssignments
firebase.collection.loginCredentials=loginCredentials
firebase.collection.projectEmployees=projectEmployees
firebase.collection.employeeProjects=employeeProjects
firebase.collection.projectReports=projectReports

## Enable Firebase initialization
firebase.enabled=true

## Use the bundled serviceAccountKey.json on the classpath (works cross-platform)
firebase.serviceAccount.path=classpath:serviceAccountKey.json

# --- Mail (configure your SMTP server) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# App-specific email defaults
app.mail.from=no-reply@timetracker.local
app.frontend.loginUrl=http://localhost:5173